media:
  - name: uploads
    label: Website images
    input: public/assets/images
    output: /assets/images
    categories: [image]
settings:
  content:
    merge: true
content:
  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.json
    format: json
    fields:
      - name: extraSections
        label: Add New Sections and Cards
        type: object
        list: { collapsible: { collapsed: true, summary: "{heading}" } }
        fields: &new_section_fields
          - { name: heading, label: Section Heading, type: string }
          - { name: description, label: Section Description, type: text }
          - { name: buttonText, label: Section Button Label, type: string }
          - { name: buttonUrl, label: Section Button URL, type: string }
          - name: cards
            label: Additional Cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Card Title, type: string }
              - { name: description, label: Card Description, type: text }
              - { name: image, label: Card Image, type: image, options: { media: uploads } }
              - { name: imageAlt, label: Image Alt Text, type: string }
              - { name: buttonText, label: Card Button Text, type: string }
              - { name: buttonUrl, label: Card Button URL, type: string }
      - name: hero
        label: Homepage hero
        type: object
        fields:
          - { name: headingBefore, label: Heading beginning, type: string }
          - { name: headingHighlight, label: Highlighted heading, type: string }
          - { name: headingAfter, label: Heading ending, type: string }
          - { name: description, label: Intro description, type: text }
      - name: outsideGroups
        label: Hero, pricing and visual sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields: &section_fields
          - { name: heading, label: Heading, type: string }
          - { name: originalHeading, type: string, hidden: true }
          - { name: headingSource, type: text, hidden: true }
          - { name: sourceOffset, type: number, hidden: true }
          - name: items
            label: Paragraphs, features and card text
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{text}"
            fields:
              - { name: text, label: Content, type: text }
              - { name: originalText, type: text, hidden: true }
              - { name: source, type: text, hidden: true }
              - { name: sourceOffset, type: number, hidden: true }
              - { name: tag, type: string, hidden: true }
      - name: contentGroups
        label: Page sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields: *section_fields
      - name: buttons
        label: Buttons and destinations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields: &button_fields
          - { name: text, label: Button label, type: string }
          - { name: url, label: Button destination, type: string }
          - { name: originalText, type: text, hidden: true }
          - { name: originalUrl, type: string, hidden: true }
          - { name: source, type: text, hidden: true }
          - { name: sourceOffset, type: number, hidden: true }
      - name: cardLinks
        label: Product cards and visual links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields: &card_link_fields
          - { name: url, label: Card destination, type: string }
          - { name: label, type: string, hidden: true }
          - { name: originalUrl, type: string, hidden: true }
          - { name: source, type: text, hidden: true }
          - { name: sourceOffset, type: number, hidden: true }
      - name: mediaImages
        label: Images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields: &image_fields
          - { name: src, label: Image file or URL, type: image, options: { media: uploads } }
          - { name: alt, label: Image description, type: string }
          - { name: originalSrc, type: string, hidden: true }
          - { name: originalAlt, type: string, hidden: true }
          - { name: source, type: text, hidden: true }
          - { name: sourceOffset, type: number, hidden: true }
      - name: labelTexts
        label: Badges, stats and small labels
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - { name: text, label: Label text, type: string }
          - { name: originalText, type: string, hidden: true }
          - { name: source, type: text, hidden: true }
          - { name: sourceOffset, type: number, hidden: true }
          - { name: ordinal, type: number, hidden: true }
      - name: priceValues
        label: Prices
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{value}"
        fields: &price_fields
          - { name: value, label: Price, type: string }
          - { name: originalValue, type: string, hidden: true }
          - { name: source, type: text, hidden: true }
          - { name: sourceOffset, type: number, hidden: true }
          - { name: mode, type: string, hidden: true }
      - { name: seoTitle, label: SEO title, type: string }
      - { name: seoDescription, label: SEO description, type: text }
      - { name: seoCanonical, label: Canonical URL Override (optional), type: string }
      - { name: seoRobots, label: Indexing Robots Override (optional), type: string }
      - { name: seoSocialImage, label: Social Sharing Image (optional), type: image, options: { media: uploads } }
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{slug}.json"
    view: { primary: title, fields: [title, route] }
    operations: { rename: false, delete: false }
    fields:
      - name: extraSections
        label: Add New Sections and Cards
        type: object
        list: { collapsible: { collapsed: true, summary: "{heading}" } }
        fields: *new_section_fields
      - name: productHero
        label: Product details
        type: object
        fields:
          - { name: name, label: Product name, type: string }
          - { name: description, label: Short description, type: text }
          - { name: price, label: Product price, type: string }
          - { name: image, label: Product image, type: image, options: { media: uploads } }
          - { name: imageAlt, label: Image description, type: string }
          - { name: buttonLabel, label: Buy Now button text, type: string }
          - { name: buttonUrl, label: Buy Now or checkout link, type: string }
          - name: features
            label: Key product features
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{text}"
            fields:
              - { name: text, label: Feature, type: string }
              - { name: originalText, type: string, hidden: true }
              - { name: source, type: text, hidden: true }
              - { name: sourceOffset, type: number, hidden: true }
          - { name: originalName, type: string, hidden: true }
          - { name: nameSource, type: text, hidden: true }
          - { name: nameOffset, type: number, hidden: true }
          - { name: originalDescription, type: text, hidden: true }
          - { name: descriptionSource, type: text, hidden: true }
          - { name: descriptionOffset, type: number, hidden: true }
          - { name: originalPrice, type: string, hidden: true }
          - { name: priceSource, type: text, hidden: true }
          - { name: priceOffset, type: number, hidden: true }
          - { name: originalImage, type: string, hidden: true }
          - { name: originalImageAlt, type: string, hidden: true }
          - { name: imageSource, type: text, hidden: true }
          - { name: imageOffset, type: number, hidden: true }
          - { name: originalButtonLabel, type: string, hidden: true }
          - { name: originalButtonUrl, type: string, hidden: true }
          - { name: buttonSource, type: text, hidden: true }
          - { name: buttonOffset, type: number, hidden: true }
      - name: outsideGroups
        label: Hero, pricing and visual sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields: *section_fields
      - name: contentGroups
        label: Content sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields: *section_fields
      - name: labelTexts
        label: Badges, stats and small labels
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - { name: text, label: Label text, type: string }
          - { name: originalText, type: string, hidden: true }
          - { name: source, type: text, hidden: true }
          - { name: sourceOffset, type: number, hidden: true }
          - { name: ordinal, type: number, hidden: true }
      - name: priceValues
        label: Pricing
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{value}"
        fields: *price_fields
      - name: buttons
        label: Buttons and destinations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields: *button_fields
      - name: cardLinks
        label: Product cards and visual links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields: *card_link_fields
      - name: mediaImages
        label: Images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields: *image_fields
      - { name: seoTitle, label: SEO title, type: string }
      - { name: seoDescription, label: SEO description, type: text }
      - { name: seoCanonical, label: Canonical URL Override (optional), type: string }
      - { name: seoRobots, label: Indexing Robots Override (optional), type: string }
      - { name: seoSocialImage, label: Social Sharing Image (optional), type: image, options: { media: uploads } }
  - name: pages
    label: Pages and guides
    type: collection
    path: content/pages
    format: json
    filename: "{slug}.json"
    view: { primary: title, fields: [title, route] }
    operations: { rename: false, delete: false }
    fields:
      - name: extraSections
        label: Add New Sections and Cards
        type: object
        list: { collapsible: { collapsed: true, summary: "{heading}" } }
        fields: *new_section_fields
      - { name: title, label: Page title, type: string }
      - name: outsideGroups
        label: Hero, pricing and visual sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields: *section_fields
      - name: contentGroups
        label: Content sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields: *section_fields
      - name: labelTexts
        label: Badges, stats and small labels
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - { name: text, label: Label text, type: string }
          - { name: originalText, type: string, hidden: true }
          - { name: source, type: text, hidden: true }
          - { name: sourceOffset, type: number, hidden: true }
          - { name: ordinal, type: number, hidden: true }
      - name: priceValues
        label: Pricing
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{value}"
        fields: *price_fields
      - name: buttons
        label: Buttons and destinations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields: *button_fields
      - name: cardLinks
        label: Product cards and visual links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields: *card_link_fields
      - name: mediaImages
        label: Images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields: *image_fields
      - { name: seoTitle, label: SEO title, type: string }
      - { name: seoDescription, label: SEO description, type: text }
      - { name: seoCanonical, label: Canonical URL Override (optional), type: string }
      - { name: seoRobots, label: Indexing Robots Override (optional), type: string }
      - { name: seoSocialImage, label: Social Sharing Image (optional), type: image, options: { media: uploads } }
  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    format: json
    filename:
      template: "{primary}.json"
      field: false
    exclude: [README.md]
    view: { primary: title, fields: [title, excerpt] }
    fields:
      - { name: title, label: Blog title, type: string, required: true }
      - { name: excerpt, label: Excerpt, type: text }
      - { name: featuredImage, label: Featured image, type: image, options: { media: uploads } }
      - name: body
        label: Article content
        type: rich-text
        options: { format: html, media: uploads, switcher: false }
      - { name: seoTitle, label: SEO title, type: string }
      - { name: seoDescription, label: SEO description, type: text }
      - { name: seoCanonical, label: Canonical URL Override (optional), type: string }
      - { name: seoRobots, label: Indexing Robots Override (optional), type: string }
      - { name: seoSocialImage, label: Social Sharing Image (optional), type: image, options: { media: uploads } }
  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: siteName, label: Website name, type: string }
      - { name: faviconUrl, label: Site Favicon (optional upload), type: image, options: { media: uploads } }
      - { name: originalSiteName, type: string, hidden: true }
      - name: siteChrome
        label: Header and footer
        type: object
        fields:
          - { name: headerLogo, label: Header logo, type: image, options: { media: uploads } }
          - { name: originalHeaderLogo, type: string, hidden: true }
          - name: headerLinks
            label: Main menu
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{text}"
            fields:
              - { name: text, label: Menu label, type: string }
              - { name: url, label: Menu link, type: string }
              - { name: originalText, type: string, hidden: true }
              - { name: originalUrl, type: string, hidden: true }
          - { name: footerLogo, label: Footer logo, type: image, options: { media: uploads } }
          - { name: originalFooterLogo, type: string, hidden: true }
          - { name: footerText, label: Footer description, type: text }
          - { name: originalFooterText, type: text, hidden: true }
          - name: footerLinks
            label: Footer links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{text}"
            fields:
              - { name: text, label: Link text, type: string }
              - { name: url, label: Destination, type: string }
              - { name: originalText, type: string, hidden: true }
              - { name: originalUrl, type: string, hidden: true }
