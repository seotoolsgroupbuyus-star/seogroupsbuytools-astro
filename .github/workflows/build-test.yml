name: Astro build test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static website
        run: npm run build
      - name: Verify all Buy Now, Sign Up and Login CTAs use payment subdomain
        run: node scripts/verify-payment-links.mjs
      - name: Check 404 status handler and permanent redirects
        run: node scripts/verify-edge.mjs
      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist/
