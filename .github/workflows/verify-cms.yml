name: Verify Pages CMS 72 pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pages CMS configuration YAML
        run: |
          ruby -e 'require "yaml"; c=YAML.load_file(".pages.yml", aliases: true); abort "Missing CMS collections" unless c.fetch("content").length == 5; abort "Merge protection disabled" unless c.dig("settings", "content", "merge") == true; puts "Pages CMS configuration syntax valid"'
      - name: Confirm every CMS list has a descriptive label and populated content
        run: ruby scripts/verify-editor-population.rb
      - name: Validate CMS content and editable fields
        run: node scripts/verify-cms.mjs
      - name: Verify blog editor and post route rendering
        run: node scripts/verify-blog.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create temporary CMS blog post for functional rendering test
        run: |
          cat > content/posts/cms-test.json <<'JSON'
          {"title":"CMS Blog Test","excerpt":"Temporary verification excerpt","featuredImage":"/assets/images/logo-header.png","body":"<h2>CMS BLOG RENDER VALIDATION</h2><p>Article content editable without HTML source mode.</p>","seoTitle":"CMS Blog SEO Title","seoDescription":"CMS Blog SEO Description","seoCanonical":"https://seogroupsbuytools.com/cms-custom-article/","seoRobots":"noindex,follow","seoSocialImage":"/assets/images/cms-social-blog.png"}
          JSON
      - name: Apply sample content edits to temporary CI worktree
        run: node scripts/verify-build-output.mjs apply
      - name: Build static website including temporary blog
        run: npm run build
      - name: Verify CMS edits changed generated website pages
        run: node scripts/verify-build-output.mjs check
      - name: Verify blog output, metadata and featured image
        run: |
          test -f dist/blog/cms-test/index.html
          test -f dist/404.html
          grep -q 'CMS BLOG RENDER VALIDATION' dist/blog/cms-test/index.html
          grep -q 'CMS Blog SEO Title' dist/blog/cms-test/index.html
          grep -q 'CMS Blog SEO Description' dist/blog/cms-test/index.html
          grep -q '/assets/images/logo-header.png' dist/blog/cms-test/index.html
          grep -q 'https://seogroupsbuytools.com/cms-custom-article/' dist/blog/cms-test/index.html
          grep -q 'noindex,follow' dist/blog/cms-test/index.html
          grep -q '/assets/images/cms-social-blog.png' dist/blog/cms-test/index.html
          rm content/posts/cms-test.json
